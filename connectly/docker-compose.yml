services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: connectly
      POSTGRES_PASSWORD: connectly
      POSTGRES_DB: connectly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectly -d connectly"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://connectly:connectly@db:5432/connectly
      SECRET_KEY: local-development-secret-change-before-deploying
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
